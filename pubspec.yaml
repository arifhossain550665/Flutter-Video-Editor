name: flutter_video_editor
description: Production video editor with trim, merge, background audio, noise cancellation and volume boosting.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Media processing
  ffmpeg_kit_flutter_new: ^2.0.0

  # File / media access
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  video_player: ^2.9.2
  gal: ^2.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
