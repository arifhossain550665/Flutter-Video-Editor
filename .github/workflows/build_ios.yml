name: Build IPA

on:
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════
  # 🍎 iOS Unsigned IPA Build
  # ══════════════════════════════════════════════════════════════
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Create iOS Project Files
        run: flutter create . --platforms=ios --project-name=flutter_video_editor

      - name: Update Podfile Target to iOS 14.0
        run: |
          ruby -e '
          podfile = "ios/Podfile"
          content = File.read(podfile)

          # Uncomment or add platform :ios, 14.0
          if content.include?("platform :ios")
            content.gsub!(/#?\s*platform :ios, .*/, "platform :ios, \x2714.0\x27")
          else
            content = "platform :ios, \x2714.0\x27\n" + content
          end

          # Force deployment target to 14.0 inside post_install hook
          target_code = "    target.build_configurations.each do |config|\n      config.build_settings[\x27IPHONEOS_DEPLOYMENT_TARGET\x27] = \x2714.0\x27\n    end\n"
          content.sub!("flutter_additional_ios_build_settings(target)", "flutter_additional_ios_build_settings(target)\n" + target_code)

          File.write(podfile, content)
          puts "--- Updated Podfile ---"
          puts File.read(podfile)
          '

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Clean old Pods
        run: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update

      - name: Force disable code signing in Xcode project
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = .*/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' Runner.xcodeproj/project.pbxproj

      - name: List available schemes (debug)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -list

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0

      - name: Verify archive created
        run: |
          find build/ios/archive -maxdepth 4

      - name: Manually export IPA from Archive (unsigned)
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app not found inside archive!"
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -X Runner-unsigned.ipa Payload
          cd -

      - name: Upload Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive
          path: build/ios/archive/Runner.xcarchive

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/ios/ipa/Runner-unsigned.ipa
